version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      ignore-rules:
        # The freedesktop thumbnail spec's word (the `thumbnailers`
        # directory, `.thumbnailer` descriptors).
        - thumbnailers
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      rules:
        # Enforced since the API-consistency pass (#52): every
        # exported symbol carries a doc comment starting with its
        # name, so godoc and the lys-shell-facing API stay complete.
        - name: exported
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      # Two's-complement reinterpretation of a decoded or encoded wire
      # word of the same width (s16 PCM, inotify wd, IPP integers, evdev
      # values, PulseAudio 'r' fields): the bits are the value.
      - path: ^(cava|internal/fswatch|internal/ipp|service/keytoggles|service/pulse/native)/
        linters:
          - gosec
        text: "G115: integer overflow conversion (uint16 -> int16|uint32 -> int32|uint64 -> int64|int64 -> uint64)$"
      # Workspace and window ids keep Rust's `as u64` mapping: a negative
      # Hyprland special-workspace id stays a distinct id, and the
      # ws-id-N CSS classes users style are derived from it.
      - path: ^shell/bar/(cwsbackends|hyprland)\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int(64)? -> uint64$"
      # The standard library's JPEG decoder narrows bit-stream words and
      # fixed-point DCT values whose range its arithmetic bounds.
      - path: ^third_party/jpeg/
        linters:
          - gosec
        text: "G115: integer overflow conversion"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/lys-shell)
  exclusions:
    generated: lax
