# Lets lys-shell's night light ask GeoClue for its location on a desktop with
# no location agent. Read by GeoClue 2.7 and newer from /etc/geoclue/conf.d/.
#
# A whitelist here replaces the one in geoclue.conf, so this repeats upstream's
# agents. If you added your own to geoclue.conf, add them here too.
[agent]
whitelist=geoclue-demo-agent;gnome-shell;io.elementary.desktop.agent-geoclue2;sm.puri.Phosh;lipstick;lys-shell

[lys-shell]
allowed=true
system=true
users=
