# xdg-desktop-portal routing for a lys-shell session.
#
# Install as ~/.config/xdg-desktop-portal/lys-shell-portals.conf and select with
# XDG_CURRENT_DESKTOP=lys-shell, or as the per-desktop default
# /usr/share/xdg-desktop-portal/lys-shell-portals.conf.
#
# lys-shell implements every interface natively — nothing is delegated to
# xdg-desktop-portal-gtk. `default=lys-shell` routes anything unlisted to us too.

[preferred]
default=lys-shell
org.freedesktop.impl.portal.Settings=lys-shell
org.freedesktop.impl.portal.Lockdown=lys-shell
org.freedesktop.impl.portal.ScreenCast=lys-shell
org.freedesktop.impl.portal.Screenshot=lys-shell
org.freedesktop.impl.portal.RemoteDesktop=lys-shell
org.freedesktop.impl.portal.GlobalShortcuts=lys-shell
org.freedesktop.impl.portal.Notification=lys-shell
org.freedesktop.impl.portal.Wallpaper=lys-shell
org.freedesktop.impl.portal.Inhibit=lys-shell
org.freedesktop.impl.portal.Background=lys-shell
org.freedesktop.impl.portal.Usb=lys-shell
org.freedesktop.impl.portal.Clipboard=lys-shell
org.freedesktop.impl.portal.InputCapture=lys-shell
org.freedesktop.impl.portal.FileChooser=lys-shell
org.freedesktop.impl.portal.Email=lys-shell
org.freedesktop.impl.portal.Access=lys-shell
org.freedesktop.impl.portal.Account=lys-shell
org.freedesktop.impl.portal.AppChooser=lys-shell
org.freedesktop.impl.portal.DynamicLauncher=lys-shell
org.freedesktop.impl.portal.Print=lys-shell
org.freedesktop.impl.portal.Secret=lys-shell
