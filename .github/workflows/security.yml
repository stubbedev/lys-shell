name: "security"

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: stubbedev/lys-ci/.github/workflows/security.yml@493dadd91d1312838dcb75a2d9a6012920a3be88
    with:
      go-toolchain: nix
