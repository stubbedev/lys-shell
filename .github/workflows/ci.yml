name: CI

on:
    push:
        branches: [master]
        paths:
            - "**"
            - "!docs/**"
            - "docs/config/**"
    pull_request:
        paths:
            - "**"
            - "!docs/**"
            - "docs/config/**"

permissions:
    contents: read

# Cancel superseded runs on PRs (fast feedback on fixup pushes), but never on
# master: the nix job pushes to the xilo cache, and a follow-up master push
# must not cancel that mid-build.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Vet, lint, the test suite, the race detector, the schema check and the
    # release build, in the flake's dev shell: the Go toolchain go.mod pins,
    # the lint stack, and the sway, dbus and pipewire the tests start private
    # instances of.
    check:
        name: Check (vet + lint + test + schema + build)
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: just plain
              run: nix develop --accept-flake-config -c just plain

    race:
        name: Race detector
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: just race
              run: nix develop --accept-flake-config -c just race

    # The release archive and the .deb, built the way release.yml builds
    # them, so a packaging break shows up before a tag does.
    package:
        name: Package (archive + deb)
        strategy:
            fail-fast: false
            matrix: &arches
                include:
                    - { runner: ubuntu-latest, arch: x86_64 }
                    - { runner: ubuntu-24.04-arm, arch: aarch64 }
        runs-on: ${{ matrix.runner }}
        outputs:
            version: ${{ steps.archive.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Build binaries
              run: nix develop --accept-flake-config -c just build

            - name: Build archive
              id: archive
              run: |
                  VERSION="$(./scripts/ci/version.sh)"
                  ./scripts/ci/build-archive.sh dist "${VERSION}" ${{ matrix.arch }}
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Build Debian package
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends build-essential debhelper desktop-file-utils dpkg-dev
                  ./scripts/ci/build-packages.sh "lys-shell-${{ steps.archive.outputs.version }}-${{ matrix.arch }}-linux.tar.gz" "${{ steps.archive.outputs.version }}" deb

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: archive-${{ matrix.arch }}
                  path: lys-shell-${{ steps.archive.outputs.version }}-${{ matrix.arch }}-linux.tar.gz

    rpm:
        name: Package (rpm)
        needs: package
        strategy:
            fail-fast: false
            matrix: *arches
        runs-on: ${{ matrix.runner }}
        container:
            image: fedora:latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: archive-${{ matrix.arch }}

            - name: Build Fedora package
              run: |
                  dnf -y --setopt=install_weak_deps=False install rpm-build desktop-file-utils systemd-rpm-macros
                  ./scripts/ci/build-packages.sh "lys-shell-${{ needs.package.outputs.version }}-${{ matrix.arch }}-linux.tar.gz" "${{ needs.package.outputs.version }}" rpm

    nix:
        name: Nix build + cache
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Build package
              shell: bash
              run: |
                  nix build -L --accept-flake-config --print-out-paths .#lys-shell | tee /tmp/lys-shell-outpaths

            # Push the build closure to the xilo cache on master pushes and
            # same-repo PRs (both have the token); fork PRs and Dependabot's,
            # which see only Dependabot secrets, lack it and just pull via the
            # substituter above.
            - name: setup xilo
              if: >-
                  github.event_name == 'push' ||
                  (github.event.pull_request.head.repo.full_name == github.repository &&
                  github.event.pull_request.user.login != 'dependabot[bot]')
              uses: stubbedev/xilo@dd96cb09f7781ceccd534af338a36853c80f7193 # v1.2.6
              with:
                  url: https://nix.stubbe.dev
                  cache: default/default
                  token: ${{ secrets.XILO_TOKEN }}

            # Not continue-on-error: a push that silently fails leaves every
            # consumer building from source while the job reports green.
            - name: Push to cache (xilo)
              if: >-
                  github.event_name == 'push' ||
                  (github.event.pull_request.head.repo.full_name == github.repository &&
                  github.event.pull_request.user.login != 'dependabot[bot]')
              run: |
                  xilo push default/default $(cat /tmp/lys-shell-outpaths)

    hyprland-vm:
        name: Hyprland VM
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: The shell on a live Hyprland
              run: nix build -L --accept-flake-config .#checks.x86_64-linux.lys-shell-hyprland-vm

    ci-status:
        name: CI Status
        if: always()
        needs: [check, race, package, rpm, nix, hyprland-vm]
        runs-on: ubuntu-latest
        steps:
            - name: Check results
              run: |
                  if [[ "${{ needs.check.result }}" != "success" || \
                        "${{ needs.race.result }}" != "success" || \
                        "${{ needs.package.result }}" != "success" || \
                        "${{ needs.rpm.result }}" != "success" || \
                        "${{ needs.nix.result }}" != "success" || \
                        "${{ needs.hyprland-vm.result }}" != "success" ]]; then
                    echo "One or more checks did not pass"
                    exit 1
                  fi
                  echo "All checks passed"
