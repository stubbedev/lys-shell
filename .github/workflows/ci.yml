name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

# Cancel superseded runs on PRs (fast feedback on fixup pushes), but never on
# master: the nix job pushes to the xilo cache, and a follow-up master push
# must not cancel that mid-build.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Vet, lint, the test suite, the race detector, the schema check and the
    # release build, in the flake's dev shell: the Go toolchain go.mod pins,
    # the lint stack, and the sway, dbus and pipewire the tests start private
    # instances of.
    check:
        name: Check (vet + lint + test + race + schema + build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=

            - name: just check
              run: nix develop --accept-flake-config -c just check

    # The release archive and the .deb, built the way release.yml builds
    # them, so a packaging break shows up before a tag does.
    package:
        name: Package (archive + deb)
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.archive.outputs.version }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=

            - name: Build binaries
              run: nix develop --accept-flake-config -c just build

            - name: Build archive
              id: archive
              run: |
                  VERSION="$(./scripts/ci/version.sh)"
                  ./scripts/ci/build-archive.sh dist "${VERSION}" x86_64
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Build Debian package
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends build-essential debhelper desktop-file-utils dpkg-dev
                  ./scripts/ci/build-packages.sh "lys-shell-${{ steps.archive.outputs.version }}-x86_64-linux.tar.gz" "${{ steps.archive.outputs.version }}" deb

            - uses: actions/upload-artifact@v7
              with:
                  name: archive
                  path: lys-shell-${{ steps.archive.outputs.version }}-x86_64-linux.tar.gz

    rpm:
        name: Package (rpm)
        needs: package
        runs-on: ubuntu-latest
        container:
            image: fedora:latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: archive

            - name: Build Fedora package
              run: |
                  dnf -y --setopt=install_weak_deps=False install rpm-build desktop-file-utils systemd-rpm-macros
                  ./scripts/ci/build-packages.sh "lys-shell-${{ needs.package.outputs.version }}-x86_64-linux.tar.gz" "${{ needs.package.outputs.version }}" rpm

    nix:
        name: Nix build + cache
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      # Pull from the self-hosted xilo cache on every event
                      # (incl. fork PRs — read access is public, no secret).
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=

            - name: Build package
              run: |
                  nix build -L --accept-flake-config --print-out-paths .#lys-shell | tee /tmp/lys-shell-outpaths

            # Push the build closure to the xilo cache on master pushes and
            # same-repo PRs (both have the token); fork PRs lack the secret and
            # just pull via the substituter above.
            - name: setup xilo
              if: >-
                  github.event_name == 'push' ||
                  github.event.pull_request.head.repo.full_name == github.repository
              uses: stubbedev/xilo@v1
              with:
                  url: https://nix.stubbe.dev
                  cache: default/default
                  token: ${{ secrets.XILO_TOKEN }}

            # Not continue-on-error: a push that silently fails leaves every
            # consumer building from source while the job reports green.
            - name: Push to cache (xilo)
              if: >-
                  github.event_name == 'push' ||
                  github.event.pull_request.head.repo.full_name == github.repository
              run: |
                  xilo push default/default $(cat /tmp/lys-shell-outpaths)

    ci-status:
        name: CI Status
        if: always()
        needs: [check, package, rpm, nix]
        runs-on: ubuntu-latest
        steps:
            - name: Check results
              run: |
                  if [[ "${{ needs.check.result }}" != "success" || \
                        "${{ needs.package.result }}" != "success" || \
                        "${{ needs.rpm.result }}" != "success" || \
                        "${{ needs.nix.result }}" != "success" ]]; then
                    echo "One or more checks did not pass"
                    exit 1
                  fi
                  echo "All checks passed"
